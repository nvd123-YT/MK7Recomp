# Builds desktop packages on main for testing; publishes only from version tags.
name: Mario Kart 7 Recompiled Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag to release, or a branch to build when publish is off
        required: true
      publish:
        description: publish a GitHub Release after all builds succeed
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: mario-kart-7-windows-x86_64.zip
          # Build on an older Linux userspace for broader compatibility.
          - os: ubuntu-latest
            container: ubuntu:22.04
            archive: mario-kart-7-linux-x86_64.tar.gz
          - os: macos-latest
            archive: mario-kart-7-macos-arm64.zip
          - os: macos-15-intel
            archive: mario-kart-7-macos-x86_64.zip
            try: --rasterizer software
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates clang curl file git libasound2-dev libudev-dev pkg-config zsync
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build desktop runtime
        run: cargo build --release --locked -p zakuro

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          Get-Content recomplauncher.json -Raw | ConvertFrom-Json | Out-Null
          Compress-Archive -Path target/release/mario-kart-7.exe, README.md, LICENSE, recomplauncher.json -DestinationPath ${{ matrix.archive }}
          Expand-Archive -Path ${{ matrix.archive }} -DestinationPath package-check -Force
          if (!(Test-Path package-check/recomplauncher.json)) { throw "recomplauncher.json is missing from the Windows package" }
          $env:RUST_LOG = 'info'
          target/release/mario-kart-7.exe --test-pattern --headless 1 --mute

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          python3 -m json.tool recomplauncher.json > /dev/null
          tar czf ${{ matrix.archive }} README.md LICENSE recomplauncher.json -C target/release mario-kart-7
          tar -tzf ${{ matrix.archive }} | grep -Fx recomplauncher.json
          sh packaging/appimage.sh target/release/mario-kart-7 mario-kart-7-linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./mario-kart-7-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/recomplauncher.json
          rm -rf squashfs-root
          APPIMAGE_EXTRACT_AND_RUN=1 RUST_LOG=info ./mario-kart-7-linux-x86_64.AppImage --test-pattern --headless 1 --mute

      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${VERSION#v}"
          if [ "$version" = "main" ]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
          sh packaging/macos-app.sh target/release/mario-kart-7 "$version" ${{ matrix.archive }}
          ditto -x -k ${{ matrix.archive }} unpacked
          test -f unpacked/recomplauncher.json
          test -f "unpacked/Mario Kart 7 Recompiled.app/Contents/Resources/recomplauncher.json"
          RUST_LOG=info "unpacked/Mario Kart 7 Recompiled.app/Contents/MacOS/mario-kart-7" --test-pattern --headless 1 --mute ${{ matrix.try }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            mario-kart-7-linux-x86_64.AppImage*

  release:
    needs: build
    if: ${{ needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(inputs.tag, 'v')) || (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          This is an Mario Kart 7-only desktop runtime based on Zakuro and 3dsrecomp.

          No game ROM, game assets, generated title-specific C code, or compiled title library is included. Use your own lawfully obtained, decrypted Mario Kart 7 dump. Add it to a library folder, then use Recompile in the application; the title-specific output stays on your computer.

          CTGP-7-supported regional Mario Kart 7 title IDs: Japan 0004000000030600, Europe 0004000000030700, USA 0004000000030800, and Korea 0004000000030A00.

          CTGP-7 support is experimental and may or may not work. It has not been validated end-to-end with this build.

          Windows: extract mario-kart-7-windows-x86_64.zip and run mario-kart-7.exe.
          macOS Apple silicon: extract mario-kart-7-macos-arm64.zip and open Mario Kart 7 Recompiled.app.
          macOS Intel: extract mario-kart-7-macos-x86_64.zip and open Mario Kart 7 Recompiled.app.
          Linux: run mario-kart-7-linux-x86_64.AppImage, or extract mario-kart-7-linux-x86_64.tar.gz and run ./mario-kart-7.

          The macOS app is not notarized. On first launch, allow it in System Settings > Privacy & Security > Open Anyway.
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Mario Kart 7 Recompiled $TAG" --notes-file notes.md --generate-notes
