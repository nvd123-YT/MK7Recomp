# Builds and tests Mario Kart 7 on Linux, macOS and Windows.
name: Mario Kart 7 Recompiled CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-pretendo-network
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_run:
    workflows: ["Build Vulkan Fragment Shaders"]
    types: [completed]
    branches: [main]

jobs:
  cleanup-other-runs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Finalize Mario Kart 7 1.0.6 workflow cleanup' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel other queued and running workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          KEEP_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Keeping this newest CI run: $KEEP_RUN_ID"
          gh api "repos/$REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status != "completed") | .id' |
          while read -r run_id; do
            if [ "$run_id" = "$KEEP_RUN_ID" ]; then
              continue
            fi
            echo "Cancelling workflow run $run_id"
            gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null
          done

  test:
    needs: cleanup-other-runs
    if: ${{ always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Sound library headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Fonts for Japanese, so the font tests draw with one
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace
      - name: Keep the Windows program
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: mario-kart-7-windows
          path: target/release/mario-kart-7.exe
